<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Enviada | Muchas Gracias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="icon" href="src/icono.png" type="image/png" style="width: 15em;">
</head>
<body class="bg-white text-brand-black min-h-screen flex items-center justify-center p-6 antialiased">

    <main class="max-w-xl w-full text-center relative border border-gray-100 bg-white p-8 md:p-12 shadow-2xl">
        <div class="w-12 h-0.5 bg-brand-gold mx-auto mb-6"></div>

        <span class="text-brand-gold text-xs uppercase tracking-[0.3em] font-semibold block mb-2">
            Mensaje Recibido
        </span>

        <h1 class="font-serif text-3xl md:text-5xl mb-4 leading-tight">
            Gracias por contactarnos
        </h1>

        <p class="text-gray-500 font-light text-sm md:text-base leading-relaxed mb-8 max-w-md mx-auto">
            Hemos recibido tu consulta con éxito. Un profesional de nuestro equipo revisará los detalles de tu caso y se pondrá en contacto a la brevedad.
        </p>

        <div>
            <a href="/" class="btn-premium inline-block cursor-pointer text-xs font-semibold tracking-[0.2em] uppercase">
                Volver al Inicio
            </a>
        </div>

        <p class="text-[10px] text-gray-400 mt-8 tracking-widest uppercase">
            Atención Confidencial & Profesional
        </p>
    </main>
